<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>이미지 모음</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    .image-list {
      width: 900px;
      max-width: 100%;
      margin: 0 auto;
    }

    .image-list img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 40px;
    }

    .image-list img:last-child {
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main class="image-list">
    <img src="01.jpg" alt="">
    <img src="02.jpg" alt="">
    <img src="03.jpg" alt="">
    <img src="04.jpg" alt="">
    <img src="05.jpg" alt="">
  </main>
</body>
</html>
